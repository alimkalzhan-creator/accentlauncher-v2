<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Car Launcher</title>
<style>
:root{
  --fz:1.15; --ac:#22e3d6; --ac2:#ff9a1f;
  --bg:#05080b; --panel:rgba(10,30,36,.62); --dock:linear-gradient(180deg,#151c21,#0b1013); --line:rgba(120,220,220,.25);
  --txt:#e9f6f6; --mut:#8fb3b5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:"Roboto Condensed","Roboto","Arial Narrow",sans-serif;color:var(--txt)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(900px 420px at 72% 70%, color-mix(in srgb,var(--ac) 14%,transparent), transparent 70%),
   radial-gradient(600px 300px at 20% 10%, rgba(255,255,255,.04), transparent 70%),
   linear-gradient(180deg,#0b1216 0%,#070b0e 55%,#030507 100%);}
/* fallback for old WebView without color-mix */
@supports not (background:color-mix(in srgb,red 10%,blue)){
  #stage{background:radial-gradient(900px 420px at 72% 70%, rgba(34,227,214,.12), transparent 70%),linear-gradient(180deg,#0b1216,#030507)}
}
.frame{position:absolute;pointer-events:none}
.glow{color:var(--ac);text-shadow:0 0 12px var(--ac)}
.panel{position:absolute;border:1.5px solid var(--line);border-radius:18px;background:var(--panel);
  box-shadow:inset 0 0 30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.4);overflow:hidden;
  border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
.panel:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/100% 6px;pointer-events:none}
.tap{cursor:pointer;transition:transform .12s, filter .12s}
.tap:active{transform:scale(.96);filter:brightness(1.3)}

/* top bar */
#topbar{position:absolute;left:26px;top:14px;height:58px;width:520px}
#avatar{position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle,#2a3238 40%,#11171b 42%,#1b2328 70%,#0c1013 72%);border:2px solid #39434a;
  display:flex;align-items:center;justify-content:center}
#weatherPill{position:absolute;left:0;border-radius:10px 0 0 10px;top:9px;height:42px;min-width:360px;max-width:640px;padding-right:46px;white-space:nowrap;overflow:hidden;
  background:var(--ac2);background:linear-gradient(90deg,var(--ac2),color-mix(in srgb,var(--ac2) 60%,#000));
  clip-path:polygon(0 0,92% 0,100% 100%,0 100%);display:flex;align-items:center;padding-left:26px;gap:10px;
  font-size:calc(24px*var(--fz));color:#2a1600;font-weight:700;letter-spacing:.5px}
#topRight{position:absolute;right:24px;top:16px;display:flex;gap:12px;align-items:center}
.iconBtn{width:50px;height:50px;border-radius:14px;border:1.5px solid var(--line);background:rgba(10,30,36,.6);
  display:flex;align-items:center;justify-content:center;border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.iconBtn svg{width:28px;height:28px;stroke:var(--ac);fill:none;stroke-width:2}
#netTime{font-size:calc(20px*var(--fz));color:var(--mut)}

/* slots */
#slotA{left:26px;top:88px;width:500px;height:236px}
#slotB{left:26px;top:340px;width:500px;height:236px}
#slotC{right:24px;top:80px;width:380px;height:250px}
#clockBar{position:absolute;left:546px;top:92px;width:310px;height:190px;text-align:center}
#clockBar .t{font-size:96px;font-weight:300;letter-spacing:4px;line-height:100px;text-shadow:0 0 18px rgba(0,0,0,.6)}
#clockBar .d{margin:6px auto 0;width:250px;font-size:calc(22px*var(--fz));display:flex;justify-content:space-between;text-shadow:0 0 10px rgba(0,0,0,.7)}
#clockBar .bar{margin:12px auto 0;width:250px;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
#clockBar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),#ffd36a);box-shadow:0 0 10px var(--ac2)}

/* car */
#carWrap{position:absolute;left:520px;top:300px;width:760px;height:290px;display:flex;align-items:flex-end;justify-content:center}
#carBox{position:relative;display:inline-block;line-height:0}
#carBox .fx{position:absolute;pointer-events:none;opacity:0;transition:opacity .5s}
#carBox.lights .fx.l{opacity:1}
.beam{left:-9%;top:40%;width:20%;height:38%;background:radial-gradient(ellipse at 100% 50%,rgba(235,250,255,.55),rgba(160,220,255,.18) 40%,transparent 72%);clip-path:polygon(100% 35%,0 0,0 100%,100% 70%);filter:blur(2px)}
.hglow{left:0;top:46%;width:14%;height:16%;border-radius:50%;background:radial-gradient(ellipse at 40% 50%,#fff 0,rgba(210,245,255,.9) 25%,rgba(120,210,255,.35) 55%,transparent 72%);mix-blend-mode:screen}
.tglow{left:85%;top:33%;width:15%;height:18%;border-radius:50%;background:radial-gradient(ellipse at 55% 50%,rgba(255,80,80,.95) 0,rgba(255,30,40,.55) 35%,transparent 70%);mix-blend-mode:screen}
#carWrap img{width:640px!important;max-height:250px!important;margin-bottom:6px;filter:drop-shadow(0 0 1px rgba(200,230,235,.35)) drop-shadow(0 14px 16px rgba(0,0,0,.7))!important}
#carWrap svg,#carWrap img{width:700px;max-height:280px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.7))}
#carFloor{position:absolute;left:560px;top:540px;width:680px;height:60px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(34,227,214,.3),transparent 70%);background:radial-gradient(ellipse at center,color-mix(in srgb,var(--ac) 35%,transparent),transparent 70%);opacity:.7}
#carName{position:absolute;left:600px;top:340px;font-size:calc(15px*var(--fz));letter-spacing:6px;color:var(--mut);text-transform:uppercase}

/* dock */
#dock{position:absolute;left:26px;right:24px;top:604px;height:100px;display:flex;border:1.5px solid #3a454c;border-radius:14px;
  background:var(--dock);box-shadow:0 -6px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
#dock .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-right:1px solid #232c32}
#dock .d:last-child{border-right:none}
#dock svg{width:38px;height:38px;stroke:#dfe9ea;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dock .d span{font-size:calc(21px*var(--fz));color:#dfe9ea;letter-spacing:.3px;white-space:nowrap}
#dock .d:active svg{stroke:var(--ac);filter:drop-shadow(0 0 6px var(--ac))}

/* widgets common */
.w{position:absolute;top:0;left:0;right:0;bottom:0;padding:16px 20px}
.w .lbl{font-size:calc(15px*var(--fz));color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.w .big{font-weight:300;line-height:1}
.ctrl{display:flex;gap:26px;align-items:center}
.ctrl div{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.ctrl svg{width:34px;height:34px;fill:var(--ac);filter:drop-shadow(0 0 6px var(--ac))}
/* music */
.cover{position:absolute;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#bff6ff,var(--ac) 40%,#0b3a44 75%);box-shadow:0 0 22px var(--ac);
  background-size:cover;background-position:center;border:3px solid rgba(255,255,255,.25)}
.cover.spin{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* compass */
.rose{position:absolute;width:150px;height:150px}
.rose .num{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(30px*var(--fz));color:var(--ac);text-shadow:0 0 10px var(--ac)}
.rose .num small{font-size:calc(16px*var(--fz))}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:calc(16px*var(--fz))}
.cal b{color:var(--mut);font-weight:400;font-size:calc(13px*var(--fz));padding-bottom:4px}
.cal span{padding:4px 0;border-radius:8px;color:var(--txt)}
.cal span.o{color:rgba(255,255,255,.22)}
.cal span.we{color:var(--ac2)}
.cal span.today{background:var(--ac);color:#03181a;font-weight:700;box-shadow:0 0 12px var(--ac)}
/* apps widget */
.nav{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;border-radius:16px;background:linear-gradient(rgba(120,220,220,.06) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(120,220,220,.06) 1px,transparent 1px) 0 0/32px 32px}
.nmap{position:absolute;left:0;top:0;will-change:transform}
.nmap img{position:absolute;width:256px;height:256px;filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5)}
.nvig{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55));pointer-events:none}
.nme{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px}
.nme svg{width:44px;height:44px;filter:drop-shadow(0 0 8px var(--ac))}
.ninfo{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(5,10,12,.82);border:1px solid var(--line)}
.ninfo img{width:52px;height:52px;flex:none}
.nbtns{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px}
.nb{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:rgba(5,10,12,.8);border:1px solid var(--line);font-size:calc(16px*var(--fz));white-space:nowrap}
.nb.go{background:var(--ac);color:#03181a;font-weight:700;border-color:var(--ac)}
.nwait{position:absolute;left:0;right:0;top:40%;text-align:center;color:var(--mut);font-size:calc(17px*var(--fz))}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:100%}
.agrid .a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;background:rgba(255,255,255,.04)}
.agrid .a img,.agrid .a .ph{width:46px;height:46px;border-radius:12px}
.agrid .a .ph{background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:calc(26px*var(--fz));color:var(--ac)}
.agrid .a span{font-size:calc(13px*var(--fz));color:var(--mut);max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* overlays */
.ov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(3,6,8,.97);display:none;z-index:50}
.ov.on{display:block}
.ovHead{height:74px;display:flex;align-items:center;padding:0 28px;gap:18px;border-bottom:1px solid var(--line)}
.ovHead h2{font-size:calc(28px*var(--fz));font-weight:400;flex:1}
.ovBody{position:absolute;top:74px;left:0;right:0;bottom:0;overflow-y:auto;padding:22px 28px;-webkit-overflow-scrolling:touch}
.apps{display:grid;grid-template-columns:repeat(8,1fr);gap:18px 10px}
.apps .a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;border-radius:14px}
.apps .a:active{background:rgba(255,255,255,.08)}
.apps img,.apps .ph{width:72px;height:72px;border-radius:16px}
.apps .ph{background:rgba(255,255,255,.08)}
.apps span{font-size:calc(15px*var(--fz));text-align:center;color:var(--txt);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect{margin-bottom:26px}
.prog{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);box-shadow:0 0 8px var(--ac)}
#mpTop{display:flex;gap:26px;align-items:center;margin-bottom:18px}
#mpArt{width:170px;height:170px;border-radius:18px;flex:none;background:radial-gradient(circle at 35% 30%,#bff6ff,var(--ac) 40%,#0b3a44 75%);background-size:cover;background-position:center;box-shadow:0 0 24px rgba(0,0,0,.6)}
#mpInfo{flex:1;min-width:0}
#mpSeek{width:100%;margin:14px 0 4px}
.mpBtns{display:flex;gap:18px;align-items:center;margin-top:8px}
.mpBtns .b{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line)}
.mpBtns .b svg{width:34px;height:34px;fill:var(--ac)}
.mpBtns .b.main{width:84px;height:84px;background:var(--ac)}.mpBtns .b.main svg{fill:#03181a;width:42px;height:42px}
.mpBtns .b.on{background:rgba(255,255,255,.12);border-color:var(--ac)}
#mpSearch{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font-size:calc(18px*var(--fz));margin-bottom:10px;-webkit-user-select:text;user-select:text}
#mpList .tr{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
#mpList .tr.cur{background:rgba(255,255,255,.07)}#mpList .tr.cur .tt{color:var(--ac)}
#mpList .n{width:44px;color:var(--mut);text-align:right;font-size:calc(15px*var(--fz))}
#mpList .tt{font-size:calc(19px*var(--fz))}#mpList .ta{font-size:calc(15px*var(--fz));color:var(--mut)}
#mpList .du{margin-left:auto;color:var(--mut);font-size:calc(15px*var(--fz))}
.sect h3{font-size:calc(18px*var(--fz));color:var(--mut);font-weight:400;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}
.sw{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.sw .c{width:64px;height:64px;border-radius:16px;border:3px solid transparent;position:relative}
.sw .c.sel{border-color:#fff}
.sw .c.nd:after{display:none}
.sw .c:after{content:"";position:absolute;right:6px;bottom:6px;width:18px;height:18px;border-radius:50%;background:var(--c2);border:2px solid rgba(0,0,0,.4)}
.row{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.row .k{width:270px;font-size:calc(19px*var(--fz))}
.chip{padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:calc(17px*var(--fz));color:var(--txt);background:rgba(255,255,255,.03)}
.chip.sel{background:var(--ac);color:#03181a;border-color:var(--ac);font-weight:700}
.btn{padding:12px 20px;border-radius:12px;background:rgba(255,255,255,.08);font-size:calc(18px*var(--fz));border:1.5px solid var(--line)}
input[type=range]{width:360px;height:30px;accent-color:var(--ac)}
.hint{font-size:calc(15px*var(--fz));color:var(--mut);margin-top:4px}
#toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--line);
  padding:12px 22px;border-radius:12px;font-size:calc(18px*var(--fz));z-index:99;display:none}
</style>
</head>
<body>
<div id="stage"><div id="bgLayer" style="position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;display:none"></div>

  <!-- decorative frame -->
  <svg class="frame" style="left:0;top:0" width="1280" height="720" viewBox="0 0 1280 720">
    <defs>
      <linearGradient id="fr" x1="0" x2="1"><stop offset="0" stop-color="#3b464d"/><stop offset=".5" stop-color="#58656d"/><stop offset="1" stop-color="#2c353b"/></linearGradient>
    </defs>
    <path d="M430 8 L860 8 L880 26 L1100 26" stroke="url(#fr)" stroke-width="4" fill="none"/>
    <g fill="#4a565e"><rect x="560" y="30" width="22" height="10" rx="2"/><rect x="600" y="30" width="22" height="10" rx="2"/><rect x="640" y="30" width="22" height="10" rx="2"/></g>
    <path d="M1000 18 l40 0 l12 14 l-40 0z M1050 18 l40 0 l12 14 l-40 0z" fill="#38434a"/>
    <path d="M540 586 L700 586 L716 572 L1100 572 L1116 586 L1256 586" stroke="url(#fr)" stroke-width="3" fill="none"/>
    <path d="M14 90 L14 560" stroke="#2a3338" stroke-width="3"/>
  </svg>

  <div id="topbar">
    <div id="weatherPill" class="tap" onclick="refreshWeather(true)"><span id="wIcon">⛅</span><span id="wPill">--° …</span></div>
  </div>
  <div id="topRight">
    <span id="netTime"></span>
    <div class="iconBtn tap" onclick="openSettings()" title="Настройки лаунчера">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg>
    </div>
  </div>

  <div id="slotA" class="panel"></div>
  <div id="slotB" class="panel"></div>
  <div id="slotC" class="panel"></div>

  <div id="clockBar">
    <div class="t" id="cTime">00:00</div>
    <div class="d"><span id="cDow">—</span><span id="cDate">—</span></div>
    <div class="bar"><i id="cBar" style="width:0"></i></div>
  </div>

  <div id="carFloor"></div>
  <div id="carWrap" class="tap"></div>

  <div id="dock"></div>

  <!-- all apps -->
  <div id="ovApps" class="ov">
    <div class="ovHead"><h2 id="appsTitle">Приложения</h2><div class="btn tap" onclick="closeOv()">✕ Закрыть</div></div>
    <div class="ovBody"><div id="appsGrid" class="apps"></div></div>
  </div>

  <!-- music player -->
  <div id="ovMusic" class="ov">
    <div class="ovHead"><h2>Музыка</h2><div class="btn tap" onclick="scanAsked=true;A.localScan();toast('Ищу музыку…')">⟳ Обновить список</div><div class="btn tap" onclick="closeOv()">✕ Закрыть</div></div>
    <div class="ovBody" id="mpBody">
      <div id="mpTop">
        <div id="mpArt"></div>
        <div id="mpInfo">
          <div class="ellip" id="mpTitle" style="font-size:calc(30px*var(--fz))">—</div>
          <div class="ellip" id="mpArtist" style="font-size:calc(19px*var(--fz));color:var(--mut);margin-top:4px">—</div>
          <input type="range" id="mpSeek" min="0" max="1000" value="0">
          <div style="display:flex;justify-content:space-between;color:var(--mut);font-size:calc(15px*var(--fz))"><span id="mpPos">0:00</span><span id="mpDur">0:00</span></div>
          <div class="mpBtns">
            <div class="b tap" id="mpShuf" onclick="A.localCmd('shuffle')"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.5l-7 9H4v-2h2.5l7-9H17zM4 7h3.5l2 2.6-1.3 1.6L6.5 9H4zm13 6l4 4-4 4v-3h-3.5l-2-2.6 1.3-1.6 1.7 2.2H17z"/></svg></div>
            <div class="b tap" onclick="A.localCmd('prev')"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></div>
            <div class="b main tap" id="mpPlay" onclick="A.localCmd('toggle')"></div>
            <div class="b tap" onclick="A.localCmd('next')"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></div>
            <div class="b tap" id="mpRep" onclick="A.localCmd('repeat')"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg><b id="mpRep1" style="position:absolute;font-size:12px;color:var(--ac2)"></b></div>
          </div>
        </div>
      </div>
      <input id="mpSearch" placeholder="Поиск по трекам и исполнителям">
      <div id="mpList"></div>
    </div>
  </div>

  <!-- settings -->
  <div id="ovSet" class="ov">
    <div class="ovHead"><h2>Настройки лаунчера</h2><div class="btn tap" onclick="closeOv()">✓ Готово</div></div>
    <div class="ovBody" id="setBody"></div>
  </div>

  <div id="homeBanner" class="tap" style="display:none;position:absolute;right:84px;top:14px;z-index:40;padding:10px 18px;border-radius:14px;background:var(--ac);color:#03181a;font-weight:700;font-size:calc(17px*var(--fz));box-shadow:0 0 18px var(--ac);white-space:nowrap">★ Сделать лаунчером по умолчанию <span id="hbX" style="margin-left:12px;opacity:.6">✕</span></div>
  <div id="toast"></div>
</div>

<script>
/* ---------- native bridge (with browser mock for preview) ---------- */
var A = window.Android || {
  getApps:function(){return JSON.stringify([
    {pkg:"ru.yandex.yandexnavi",label:"Навигатор"},{pkg:"ru.dublgis.dgismobile",label:"2ГИС"},{pkg:"ru.yandex.music",label:"Я.Музыка"},
    {pkg:"com.google.android.youtube",label:"YouTube"},{pkg:"com.android.chrome",label:"Chrome"},{pkg:"com.android.settings",label:"Настройки"},

    h+='<div class="row"><span class="k">'+d.t+'</span><span class="chip tap" data-d="'+d.id+'">'+(p?esc(appLabel(p)):"не выбрано")+'</span>'+
    (cfg.dock[d.id]?'<span class="chip tap" data-dr="'+d.id+'">по умолчанию</span>':'')+'</div>';});
  h+='</div><div class="sect"><h3>Машина</h3><div class="row"><span class="btn tap" id="carPick">Выбрать своё фото</span><span class="btn tap" id="carReset">Вернуть стандартную машину</span></div>'+
     '<div class="hint">Лучше всего выглядит PNG без фона, машина боком или 3/4.</div></div>';
  h+='<div class="sect"><h3>Фары</h3>'+
    '<div class="row"><span class="k">Фары на картинке</span><span class="chip tap'+((cfg.lightsSrc||"ill")==="ill"?' sel':'')+'" data-ls="ill">По подсветке магнитолы (ILL)</span><span class="chip tap'+(cfg.lightsSrc==="off"?' sel':'')+'" data-ls="off">Не показывать</span></div>'+
    '<div class="row"><span class="k">Проверка</span><span class="btn tap" id="tLights">Фары</span><span class="btn tap" id="tOff">Сброс</span></div>'+'</div>';
  var isDef=true,auto=true,ovl=true;try{isDef=A.isDefaultHome();auto=A.getAutostart();ovl=A.canDrawOverlays();}catch(e){}
  h+='<div class="sect"><h3>Запуск</h3>'+
    '<div class="row"><span class="k">Лаунчер по умолчанию</span>'+(isDef?'<span class="chip sel">✓ Да</span>':'<span class="btn tap" id="setDef">Сделать по умолчанию</span>')+'</div>'+
    '<div class="row"><span class="k">Открывать при включении машины</span><span class="chip tap'+(auto?' sel':'')+'" data-as="1">Вкл</span><span class="chip tap'+(!auto?' sel':'')+'" data-as="0">Выкл</span></div>'+
    '<div class="row"><span class="k">Разрешение на автозапуск</span>'+(ovl?'<span class="chip sel">✓ Есть</span>':'<span class="btn tap" id="setOvl">Разрешить «Поверх других окон»</span>')+'</div>'+
    '<div class="hint">Для автозапуска на Android 10+ нужно разрешение «Поверх других окон». Если на магнитоле есть свой заводской выбор лаунчера (Настройки → Заводские / Главный экран), выберите там Accent Launcher.</div></div>';
  h+='<div class="sect"><h3>Система</h3><div class="row">'+
     '<span class="btn tap" id="mAccess">'+(A.hasMusicAccess()?"✓ Доступ к музыке есть":"Разрешить доступ к музыке")+'</span>'+
     '<span class="btn tap" id="sysSet">Настройки Android</span></div>'+
     '<div class="hint">Доступ к музыке нужен, чтобы показывать название трека и обложку. Версия '+esc(A.version())+'</div></div>';
  $("setBody").innerHTML=h;
  [].forEach.call(document.querySelectorAll("#setBody [data-t]"),function(e){e.onclick=function(){cfg.theme=+e.dataset.t;cfg.custom=null;save();applyTheme();renderSettings();}});
  function hsl2hex(h,s,l){s/=100;l/=100;var k=function(n){return(n+h/30)%12},a=s*Math.min(l,1-l),f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))};
    return"#"+[f(0),f(8),f(4)].map(function(x){return("0"+Math.round(x*255).toString(16)).slice(-2)}).join("");}
  function useHue(){var h1=+$("hue").value,h2=+$("hue2").value;cfg.custom={h:h1,h2:h2,a:hsl2hex(h1,95,56),b:hsl2hex(h2,100,56)};save();applyTheme();}
  $("hue").oninput=useHue;$("hue2").oninput=useHue;$("useHue").onclick=function(){useHue();renderSettings();};
  [].forEach.call(document.querySelectorAll("#setBody [data-s]"),function(e){e.onclick=function(){cfg.slots[e.dataset.s]=e.dataset.w;save();renderSettings();render();}});
  [].forEach.call(document.querySelectorAll("#setBody [data-d]"),function(e){e.onclick=function(){var id=e.dataset.d,d=DOCK.filter(function(x){return x.id===id})[0];
    pickApp("Кнопка «"+d.t+"»",function(p){cfg.dock[id]=p;save();openSettings();});}});
  [].forEach.call(document.querySelectorAll("#setBody [data-dr]"),function(e){e.onclick=function(){delete cfg.dock[e.dataset.dr];save();renderSettings();}});
  function setBg(k,v,rer){cfg.bg=bgCfg();cfg.bg[k]=v;save();applyBg();if(rer)renderSettings();}
  [].forEach.call(document.querySelectorAll("#setBody [data-bm]"),function(e){e.onclick=function(){setBg("mode",e.dataset.bm,true);}});
  [].forEach.call(document.querySelectorAll("#setBody [data-bc]"),function(e){e.onclick=function(){setBg("color",e.dataset.bc,true);}});
  $("bgPhoto").onclick=function(){A.pickBgPhoto();};
  if($("bgHue"))$("bgHue").oninput=function(){cfg.bg=bgCfg();cfg.bg.hue=+this.value;setBg("color",hsl2hex(+this.value,45,12));};
  if($("bgDim"))$("bgDim").oninput=function(){setBg("dim",this.value/100);};
  $("bgPanel").oninput=function(){setBg("panel",100-this.value);};
  [].forEach.call(document.querySelectorAll("#setBody [data-fz]"),function(e){e.onclick=function(){cfg.fz=+e.dataset.fz;save();applyTheme();renderSettings();render();}});
  [].forEach.call(document.querySelectorAll("#setBody [data-ms]"),function(e){e.onclick=function(){cfg.musicSrc=e.dataset.ms;save();renderSettings();render();}});
  $("mScan").onclick=function(){scanAsked=true;A.localScan();toast("Ищу музыку…");};
  [].forEach.call(document.querySelectorAll("#setBody [data-ls]"),function(e){e.onclick=function(){cfg.lightsSrc=e.dataset.ls;save();if(cfg.lightsSrc==="off"){car.lights=false;applyCar();}else{try{onNight(A.isNight())}catch(x){}}renderSettings();}});
  function tst(k){carTest=true;car[k]=!car[k];applyCar();}
  $("tLights").onclick=function(){tst("lights")};
  $("tOff").onclick=function(){carTest=false;car.lights=false;try{onNight(A.isNight())}catch(x){}applyCar();};
  if($("setDef"))$("setDef").onclick=function(){A.requestDefaultHome();};
  if($("setOvl"))$("setOvl").onclick=function(){A.requestOverlay();};
  [].forEach.call(document.querySelectorAll("#setBody [data-as]"),function(e){e.onclick=function(){A.setAutostart(e.dataset.as==="1");renderSettings();}});
  $("carPick").onclick=function(){A.pickCarPhoto();};
  $("carReset").onclick=function(){A.clearCarPhoto();setCar();toast("Рисунок Accent возвращён");};
  $("mAccess").onclick=function(){A.openMusicAccess();};
  $("sysSet").onclick=function(){A.openSystemSettings();};
}

/* ---------- init ---------- */
try{onNight(A.isNight());}catch(e){}
$("homeBanner").onclick=function(e){if(e.target.id==="hbX"){bannerHidden=true;checkHome();return;}A.requestDefaultHome();};
setTimeout(checkHome,800);
$("mpList").onclick=function(e){var t=e.target;while(t&&t!==this&&!t.dataset.i)t=t.parentNode;if(t&&t.dataset&&t.dataset.i!=null)A.localPlay(+t.dataset.i);};
$("mpSearch").oninput=renderList;
$("mpSeek").oninput=function(){seeking=true;$("mpPos").textContent=fmt(this.value/1000*L.dur);};
$("mpSeek").onchange=function(){A.localSeek(Math.round(this.value/1000*L.dur));seeking=false;};
try{var lw=JSON.parse(localStorage.getItem("lastW")||"null");if(lw){["temp","code","city","wind","hum","uv","press"].forEach(function(k){live[k]=lw[k]});}}catch(e){}
applyTheme();fit();buildDock();setCar();
live.musicAccess=A.hasMusicAccess();
try{onLocalList(A.localList());var st=A.localState();if(st)onLocalState(st);}catch(e){}
longPress($("carWrap"),function(){A.pickCarPhoto();},function(){});
render();tick();A.requestLocation();
</script>
</body>
</html>
